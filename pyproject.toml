[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-cross-sectional-similarity"
version = "0.1.0"
description = "A-share historical time-series and same-window cross-sectional similarity search."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "plotly>=5.20",
    "streamlit>=1.37",
    "akshare>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
research = ["aeon>=1.4", "tslearn>=0.8", "stumpy>=1.14"]
desktop = ["PySide6>=6.7"]
packaging = ["pyinstaller>=6.6"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
ashare-xsec-sim = "ashare_cross_section_similarity.cli:main"
ashare-xsec-sim-qt = "ashare_cross_section_similarity.desktop.app:main"
ashare-xsec-data-api = "ashare_cross_section_similarity.data_api:main"

[tool.setuptools]
packages = ["ashare_cross_section_similarity", "ashare_cross_section_similarity.desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
